<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrera Universitaria — LUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Paleta inspirada en la identidad real de la Liga Universitaria de Deportes (LUD):
     fondo claro, header azul marino con linea dorada, acentos celestes tipo "Otros Deportes". */
  :root{
    --bg:#EEF2F8; --surface:#FFFFFF; --surface2:#F3F6FB; --border:#D7E0EE;
    --text:#152449; --muted:#5E6E8C;
    --navy:#0F2050; --navy2:#14306E; --skyblue:#2E8FE0; --skyblue-soft:#E6F1FC;
    --gold:#F2B632; --gold-soft:#FBEBC7;
    --silver:#7C8798; --silver-soft:#E7E9EE;
    --bronze:#B9683A; --bronze-soft:#F5E2D3;
    --honor:#7B4FC9; --honor-soft:#EDE3FA;
    --confrat:#2E8FE0; --confrat-soft:#E6F1FC;
    --green:#1E9E63; --green-soft:#E3F6EC;
    --red:#D23B2B; --red-soft:#FBE6E3;
    --gold-text:#8A5D06; --silver-text:#4B5563; --bronze-text:#7A3F1D; --honor-text:#5B3499; --confrat-text:#155FA0; --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  #topbar{background:var(--navy);border-bottom:4px solid var(--gold);}
  #topbar-inner{max-width:960px;margin:0 auto;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;}
  .lud-logo{font-family:'Barlow Condensed';font-weight:800;font-size:19px;letter-spacing:.02em;color:#fff;display:flex;gap:8px;align-items:center;}
  .lud-logo b{color:var(--gold);}
  .lud-tag{font-family:'Space Grotesk';font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#BFD3F5;}
  #subnav{background:var(--navy2);border-bottom:1px solid rgba(255,255,255,.1);}
  #subnav-inner{max-width:960px;margin:0 auto;padding:8px 18px;display:flex;gap:16px;flex-wrap:wrap;}
  #subnav-inner span{font-family:'Space Grotesk';font-size:11px;color:#BFD3F5;letter-spacing:.04em;display:inline-flex;align-items:center;gap:5px;opacity:.9;}
  #subnav-inner span.hl{background:var(--skyblue);color:#fff;padding:3px 10px;border-radius:999px;opacity:1;}
  #app{max-width:960px;margin:0 auto;padding:26px 18px 40px;}
  h1,h2,h3{font-family:'Barlow Condensed',sans-serif;font-weight:700;margin:0 0 6px;letter-spacing:-0.01em;}
  .eyebrow{font-family:'Space Grotesk',monospace;text-transform:uppercase;letter-spacing:.14em;font-size:11px;color:var(--gold-text);margin-bottom:8px;font-weight:600;}
  .muted{color:var(--muted);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px;box-shadow:0 2px 10px rgba(15,32,80,.06);}
  .btn{font-family:'Space Grotesk',monospace;font-weight:500;font-size:14px;background:var(--navy);color:#fff;border:none;border-radius:999px;padding:12px 22px;cursor:pointer;transition:transform .12s ease, opacity .12s ease;}
  .btn:hover{transform:translateY(-1px);opacity:.92;}
  .btn.secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
  .btn.gold{background:var(--gold);color:#241B04;}
  .btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);}
  .btn.small{padding:8px 14px;font-size:12px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:640px){.grid2{grid-template-columns:1fr;}}
  input[type=text],input[type=number],select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font-family:'Inter';font-size:14px;outline:none;}
  textarea{resize:vertical;min-height:70px;}
  input:focus,select:focus,textarea:focus{border-color:var(--gold);}
  label.field-label{font-family:'Space Grotesk',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:block;margin-bottom:6px;}
  .pill-choice{display:flex;gap:8px;}
  .pill-choice button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-family:'Inter';font-size:14px;}
  .pill-choice button.active{background:var(--gold);border-color:var(--gold);color:#241B04;font-weight:600;}
  .pitch{background:linear-gradient(180deg,#0f2b1e,#0a1c14);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .pitch-line{display:flex;justify-content:center;gap:10px;margin:8px 0;flex-wrap:wrap;}
  .pos-btn{min-width:52px;padding:8px 4px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#F2F5FA;font-family:'Space Grotesk';font-size:12px;font-weight:600;cursor:pointer;text-align:center;}
  .pos-btn.active{background:var(--gold);border-color:var(--gold);color:#241B04;font-weight:700;}
  .shirt-card{background:radial-gradient(circle at 30% 20%, #1c3566, #0a1730);border:1px solid var(--border);border-radius:16px;padding:22px;text-align:center;}
  .shirt-num{font-family:'Barlow Condensed';font-size:56px;font-weight:800;color:var(--gold);line-height:1;}
  .shirt-name{font-family:'Space Grotesk';letter-spacing:.08em;text-transform:uppercase;font-size:15px;margin-top:4px;}
  .club-offer{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px;cursor:pointer;transition:border-color .12s ease, transform .12s ease;}
  .club-offer:hover{border-color:var(--gold);transform:translateY(-1px);}
  .club-offer .family-tag{display:inline-block;font-family:'Space Grotesk';font-size:10px;color:var(--skyblue);background:var(--skyblue-soft);padding:2px 7px;border-radius:999px;margin-top:5px;}
  .div-tag{display:inline-block;font-family:'Space Grotesk';font-size:11px;color:var(--gold-text);border:1px solid var(--gold-soft);background:var(--gold-soft);padding:2px 8px;border-radius:999px;margin-top:6px;font-weight:600;}
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;margin:14px 0;}
  .stat-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 4px;}
  .stat-box .v{font-family:'Barlow Condensed';font-size:23px;font-weight:700;}
  .stat-box .l{font-family:'Space Grotesk';font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .attr-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:10px;}
  .attr-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;}
  .attr-row .bar{flex:1;height:5px;background:var(--surface2);border-radius:3px;margin:0 8px;overflow:hidden;}
  .attr-row .bar span{display:block;height:100%;background:var(--gold);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-family:'Space Grotesk';font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--border);}
  td{padding:7px 8px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  .tag{display:inline-block;font-family:'Space Grotesk';font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--border);margin:1px 2px 1px 0;}
  .tag.up{color:var(--green);border-color:var(--green-soft);background:var(--green-soft);}
  .tag.down{color:var(--red);border-color:var(--red-soft);background:var(--red-soft);}
  .tag.oro{color:var(--gold-text);border-color:var(--gold-soft);background:var(--gold-soft);font-weight:600;}
  .tag.plata{color:var(--silver-text);border-color:var(--silver-soft);background:var(--silver-soft);font-weight:600;}
  .tag.bronce{color:var(--bronze-text);border-color:var(--bronze-soft);background:var(--bronze-soft);font-weight:600;}
  .tag.honor{color:var(--honor-text);border-color:var(--honor-soft);background:var(--honor-soft);font-weight:600;}
  .tag.confrat{color:var(--confrat-text);border-color:var(--confrat-soft);background:var(--confrat-soft);font-weight:600;}
  .badge-ovr{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;background:var(--gold);color:#241B04;border-radius:10px;font-family:'Barlow Condensed';font-weight:800;font-size:18px;}
  .event-box{border:1px dashed var(--gold-soft);background:var(--gold-soft);border-radius:12px;padding:16px;margin-bottom:16px;}
  .trophy-list{display:flex;flex-direction:column;gap:6px;}
  .trophy-item{display:flex;gap:10px;align-items:center;font-size:14px;}
  .disclaimer{font-size:12px;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:18px;}
  a{color:var(--gold-text);}

  .details-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:10px;}
  .details-row{font-size:13px;padding:5px 0;color:var(--text);}
  .details-row:before{content:'◆ ';color:var(--gold-text);}

  @keyframes trophyPop{0%{transform:scale(0) rotate(-15deg);opacity:0;}60%{transform:scale(1.2) rotate(6deg);opacity:1;}100%{transform:scale(1) rotate(0);}}
  .trophy-anim{text-align:center;margin:10px 0 18px;}
  .trophy-anim .icon{display:inline-block;animation:trophyPop .7s cubic-bezier(.34,1.56,.64,1);filter:drop-shadow(0 0 16px var(--gold));}
  .trophy-anim .icon svg{display:block;margin:0 auto;width:72px;height:auto;}
  .trophy-anim.small .icon{filter:drop-shadow(0 0 10px var(--gold));}
  .trophy-anim.small .icon svg{width:42px;}
  .trophy-anim .label{font-family:'Barlow Condensed';font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--gold-text);margin-top:4px;font-size:15px;}
  .trophy-anim.small .label{font-size:12px;}
  .trophy-anim.honor .icon{filter:drop-shadow(0 0 16px var(--honor));}
  .trophy-anim.honor .label{color:var(--honor);}

  #footerbar{max-width:960px;margin:0 auto;padding:6px 18px 30px;text-align:center;}
  .credit{font-size:10px;color:var(--muted);opacity:.55;margin-top:4px;}
  .counter{font-size:11px;color:var(--muted);opacity:.7;margin-top:2px;}

  #feedbackBtn{position:fixed;bottom:18px;right:18px;width:46px;height:46px;border-radius:50%;background:var(--gold);color:#241B04;border:none;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:50;}
  .modal-overlay{position:fixed;inset:0;background:rgba(5,10,25,.7);display:none;align-items:center;justify-content:center;z-index:60;padding:20px;}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;max-width:380px;width:100%;}
  .rate-row{display:flex;gap:10px;margin:10px 0;}
  .rate-btn{flex:1;padding:14px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);font-size:22px;cursor:pointer;text-align:center;}
  .rate-btn.active{border-color:var(--gold);background:var(--gold-soft);}

  /* ================= INSTAGRAM (perfil ficticio del jugador) ================= */
  .ig-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:16px;}
  .ig-topbar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);}
  .ig-topbar b{font-family:'Barlow Condensed';font-size:17px;color:var(--text);}
  .ig-header{display:flex;gap:16px;padding:18px 16px 8px;align-items:center;}
  .ig-avatar{width:72px;height:72px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed';font-weight:800;font-size:28px;color:#fff;border:3px solid var(--gold);}
  .ig-handle{font-weight:700;font-size:15px;color:var(--text);}
  .ig-name{color:var(--muted);font-size:13px;margin-top:1px;}
  .ig-stats-row{display:flex;gap:0;padding:14px 16px;border-bottom:1px solid var(--border);}
  .ig-stat{flex:1;text-align:center;}
  .ig-stat .n{font-family:'Barlow Condensed';font-weight:800;font-size:20px;color:var(--text);display:block;}
  .ig-stat .l{font-size:11px;color:var(--muted);}
  .ig-bio{padding:2px 16px 16px;font-size:13px;color:var(--text);line-height:1.6;}
  .ig-post{border-top:8px solid var(--surface2);}
  .ig-post-photo{background:linear-gradient(135deg,var(--navy),var(--navy2));min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;}
  .ig-post-photo .cap{color:var(--gold);font-family:'Barlow Condensed';font-weight:800;font-size:20px;text-shadow:0 2px 10px rgba(0,0,0,.4);}
  .ig-actions{display:flex;gap:14px;padding:10px 16px 4px;font-size:19px;}
  .ig-likes{padding:0 16px 6px;font-weight:700;font-size:13px;color:var(--text);}
  .ig-caption{padding:0 16px 10px;font-size:13px;color:var(--text);}
  .ig-caption b{margin-right:6px;}
  .ig-comments{padding:0 16px 16px;display:flex;flex-direction:column;gap:8px;}
  .ig-comment{font-size:13px;color:var(--text);}
  .ig-comment b{color:var(--gold-text);margin-right:6px;}
  .ig-empty{padding:0 16px 16px;font-size:13px;color:var(--muted);}
</style>
</head>
<body>
<div id="topbar">
  <div id="topbar-inner">
    <div class="lud-logo"><svg width="24" height="24" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;">
      <path d="M50 6 L90 20 V50 C90 74 72 90 50 96 C28 90 10 74 10 50 V20 Z" fill="#ffffff" opacity=".14"/>
      <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round">
        <line x1="50" y1="86" x2="20" y2="24"/>
        <line x1="50" y1="86" x2="32" y2="18"/>
        <line x1="50" y1="86" x2="44" y2="14"/>
        <line x1="50" y1="86" x2="56" y2="14"/>
        <line x1="50" y1="86" x2="68" y2="18"/>
        <line x1="50" y1="86" x2="80" y2="24"/>
      </g>
    </svg> LIGA <b>UNIVERSITARIA</b></div>
    <div class="lud-tag">Modo Carrera</div>
  </div>
</div>
<div id="subnav">
  <div id="subnav-inner">
    <span class="hl">⚽ Fútbol</span>
    <span>📊 Estadísticas</span>
    <span>🏆 Divisionales</span>
    <span>🎓 Formativas</span>
    <span onclick="openRules()" style="cursor:pointer;text-decoration:underline;">📋 Detalles de la Liga</span>
  </div>
</div>
<div id="app"></div>
<div id="footerbar">
  <div class="counter">🏆 <span id="careerCount">—</span> carreras iniciadas en total</div>
  <div class="counter">⚽ <span id="seasonsCount">—</span> partidas jugadas por todos</div>
  <div class="credit">SG</div>
</div>

<button id="feedbackBtn" title="Dejar comentario">💬</button>
<div class="modal-overlay" id="feedbackModal">
  <div class="modal-box">
    <div id="feedbackForm">
      <h3 style="font-size:18px;">¿Qué te pareció?</h3>
      <div class="rate-row">
        <button class="rate-btn" id="rateUp">👍</button>
        <button class="rate-btn" id="rateDown">👎</button>
      </div>
      <label class="field-label">Comentario / sugerencia (opcional)</label>
      <textarea id="feedbackComment" placeholder="Qué mejorarías..."></textarea>
      <div class="row" style="margin-top:12px;">
        <button class="btn gold" id="sendFeedback">Enviar</button>
        <button class="btn secondary" id="closeFeedback">Cerrar</button>
      </div>
    </div>
    <div id="feedbackThanks" style="display:none;text-align:center;">
      <h3>¡Gracias!</h3>
      <p class="muted">Tu comentario ya quedó guardado.</p>
      <button class="btn gold" id="closeFeedback2">Cerrar</button>
    </div>
  </div>
</div>

<script>
/* ================= DATA ================= */
const CATEGORIES = [
  {id:'sub14', label:'Sub 14', ageStart:13, ageEnd:14, type:'juvenil'},
  {id:'sub16', label:'Sub 16', ageStart:15, ageEnd:16, type:'juvenil'},
  {id:'sub18', label:'Sub 18', ageStart:17, ageEnd:18, type:'juvenil'},
  {id:'sub20', label:'Sub 20', ageStart:19, ageEnd:20, type:'adulta', divisions:3, teams:16},
  {id:'reserva', label:'Reserva', ageStart:21, ageEnd:21, type:'adulta', divisions:3, teams:16},
  {id:'mayores', label:'Mayores', ageStart:22, ageEnd:31, type:'adulta', divisions:7, teams:16},
  {id:'presenior', label:'Pre Senior', ageStart:32, ageEnd:39, type:'adulta', divisions:2, teams:16},
  {id:'mas40', label:'Más 40', ageStart:40, ageEnd:55, type:'adulta', divisions:1, teams:16},
];
const DIV_LETTERS = ['A','B','C','D','E','F','G','H'];
// Tamaño real de cada serie según las tablas de la Liga (varía por categoría).
const SERIE_TEAMS_BY_CAT = {sub14:12, sub16:8, sub18:8};
function serieTeamsFor(catId){ return SERIE_TEAMS_BY_CAT[catId] || 12; }

// Formación en 7 líneas de profundidad (una por rol), igual que en Copero: separa bien cada
// posición en la cancha en vez de amontonar varias en una sola fila.
const POSITION_LINES = [
  ['EI','DC','ED'], ['MCO'], ['MI','MC','MD'], ['MCD'], ['LI','LD'], ['DFC'], ['POR'],
];
const POSITION_NAMES = {
  POR:'Portero', DFC:'Defensor Central', LI:'Lateral Izquierdo', LD:'Lateral Derecho',
  MCD:'Mediocentro Defensivo', MI:'Interior Izquierdo', MC:'Mediocentro', MD:'Interior Derecho',
  MCO:'Mediapunta', EI:'Extremo Izquierdo', ED:'Extremo Derecho', DC:'Delantero Centro'
};
const GOAL_FACTOR = {POR:.02,DFC:.08,LI:.14,LD:.14,MCD:.12,MI:.24,MC:.30,MD:.24,MCO:.42,EI:.52,ED:.52,DC:.72};
const AST_FACTOR  = {POR:.01,DFC:.06,LI:.20,LD:.20,MCD:.18,MI:.30,MC:.34,MD:.30,MCO:.40,EI:.34,ED:.34,DC:.20};

const ATTR_KEYS = ['definicion','velocidad','pase','resistencia','fisico','cabezazo','vision','liderazgo'];
const ATTR_LABELS = {definicion:'Definición',velocidad:'Velocidad',pase:'Pase',resistencia:'Resistencia',fisico:'Físico',cabezazo:'Cabezazo',vision:'Visión',liderazgo:'Liderazgo'};
const POSITION_WEIGHTS = {
  POR:  {definicion:1,velocidad:2,pase:5,resistencia:4,fisico:6,cabezazo:2,vision:8,liderazgo:10},
  DFC:  {definicion:2,velocidad:5,pase:6,resistencia:6,fisico:9,cabezazo:8,vision:5,liderazgo:4},
  LI:   {definicion:3,velocidad:8,pase:7,resistencia:8,fisico:5,cabezazo:3,vision:5,liderazgo:2},
  LD:   {definicion:3,velocidad:8,pase:7,resistencia:8,fisico:5,cabezazo:3,vision:5,liderazgo:2},
  MCD:  {definicion:3,velocidad:5,pase:8,resistencia:8,fisico:6,cabezazo:4,vision:7,liderazgo:5},
  MI:   {definicion:5,velocidad:7,pase:8,resistencia:7,fisico:4,cabezazo:2,vision:7,liderazgo:2},
  MC:   {definicion:4,velocidad:5,pase:9,resistencia:8,fisico:4,cabezazo:2,vision:9,liderazgo:4},
  MD:   {definicion:5,velocidad:7,pase:8,resistencia:7,fisico:4,cabezazo:2,vision:7,liderazgo:2},
  MCO:  {definicion:7,velocidad:6,pase:8,resistencia:5,fisico:3,cabezazo:2,vision:9,liderazgo:2},
  EI:   {definicion:8,velocidad:9,pase:5,resistencia:5,fisico:3,cabezazo:2,vision:4,liderazgo:1},
  ED:   {definicion:8,velocidad:9,pase:5,resistencia:5,fisico:3,cabezazo:2,vision:4,liderazgo:1},
  DC:   {definicion:10,velocidad:7,pase:4,resistencia:4,fisico:6,cabezazo:7,vision:3,liderazgo:1},
};

const COUNTRIES = [
  {code:'URU', name:'Uruguay', flag:'🇺🇾'},
  {code:'ARG', name:'Argentina', flag:'🇦🇷'},
  {code:'BRA', name:'Brasil', flag:'🇧🇷'},
  {code:'PAR', name:'Paraguay', flag:'🇵🇾'},
  {code:'CHI', name:'Chile', flag:'🇨🇱'},
  {code:'ESP', name:'España', flag:'🇪🇸'},
];

// Nómina de clubes reales de la Liga Universitaria (todas las categorías combinadas).
// La fuerza histórica de cada club (más abajo, CLUB_POOL) se calcula de forma determinística
// a partir del nombre, así que un mismo club siempre "vive" cerca de la misma Divisional entre
// partidas, respetando su historia (un club de la G no aparece en la A de un salto).
const CLUB_NAMES = [
  'Old Christians Club','Urunday Universitario','Deportivo LS Universitario','Alemán Universitario',
  'Poco Sitio Playa Verde','Crandon Universitario','Nacional Universitario','Club Jesús María',

/* ---------- Cupón de descuento VCP ---------- */
// Código fijo de la marca: VCPLIGUERO. Es el mismo para todos (no se genera al azar), así que
// el pedido es de buena fe: usalo una sola vez por persona al presentarlo en el local o en la web.
const VCP_DISCOUNT_CODE = 'VCPLIGUERO';
function getOrCreateVcpDiscountCode(){
  return VCP_DISCOUNT_CODE;
}
function viewVcpCoupon(){ state.vcpCouponReturnScreen = state.screen; state.screen='vcpCoupon'; render(); }
function backFromVcpCoupon(){ state.screen = state.vcpCouponReturnScreen || 'home'; state.vcpCouponReturnScreen = null; render(); }
function continueFromVcpCoupon(){ state.screen = 'season'; state.vcpCouponReturnScreen = null; render(); }
function renderVcpCoupon(){
  const code = getOrCreateVcpDiscountCode();
  const isRevisit = !!state.vcpCouponReturnScreen;
  return `
  <div class="eyebrow">Beneficio del sponsor</div>
  <h2>🎟️ 15% OFF en VCP</h2>
  <div class="card" style="text-align:center;">
    <img src="${VCP_LOGO}" alt="VCP" style="height:60px;border-radius:8px;margin-bottom:14px;">

    <p style="max-width:520px;margin:0 auto 10px;">15% de descuento no acumulable con otras promociones. Válido en <strong>cualquier local VCP</strong> o en <strong>vcp.com.uy</strong>.</p>
    <div style="max-width:520px;margin:0 auto 10px;padding:10px 14px;border-radius:10px;background:#fff6de;border:1px solid #f0dfa0;font-size:12.5px;color:#6b5410;">📍 Conocé nuestro <strong>local nuevo</strong>: <strong>${VCP_STORE.addr}</strong> · ${VCP_STORE.hours}</div>
    <p class="muted" style="font-size:12px;max-width:520px;margin:0 auto;">Código único de la promo: usalo una sola vez por persona.</p>
  </div>
  ${renderVcpWinterSale()}
  <button class="btn gold" data-action="${isRevisit ? 'backFromVcpCoupon' : 'continueFromVcpCoupon'}">${isRevisit ? 'Volver' : 'Continuar mi carrera'}</button>
  `;
}

/* ================= HELPERS ================= */
const rand = (a,b)=> a + Math.random()*(b-a);
const randi = (a,b)=> Math.round(rand(a,b));
const clamp = (v,a,b)=> Math.max(a, Math.min(b,v));
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function categoryForAge(age){ return CATEGORIES.find(c=>age>=c.ageStart && age<=c.ageEnd) || null; }

/* ---------- Identidad histórica de los clubes ---------- */
// Hash determinístico: mismo nombre -> mismo número siempre (no cambia entre partidas ni recargas).
function hashStr(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31 + str.charCodeAt(i))>>>0; } return h; }

// Antes existían variantes de color (equipos filiales) para algunas instituciones, pero se
// sacaron de la nómina: ahora cada institución tiene un único club oficial (ej. "Old Christians
// Club" a secas, sin "Azul"/"Verde"/"Blanco"). Esta lógica de familias queda por compatibilidad,
// pero ya no hay ningún caso real de variantes en CLUB_NAMES.
const VARIANT_TOKENS = new Set(['Club','Azul','Verde','Blanco','Blanca','Naranja','Rojo','Roja','Rosado','Celeste','Amarillo','Amarilla']);
function clubCore(name){
  const words = name.split(' ');
  while(words.length>1 && VARIANT_TOKENS.has(words[words.length-1])) words.pop();
  return words.join(' ');
}

// Fuerza histórica en pirámide: pocos clubes "grandes" (tier 0, cerca de la A) y muchos más humildes
// (tiers altos, cerca de la G). Así se respeta que un club chico no aparezca de golpe arriba de todo.
const TIER_WEIGHTS = [3,6,10,16,22,24,19]; // tier 0..6
const TIER_CUM = (()=>{ let acc=0; return TIER_WEIGHTS.map(w=>(acc+=w)); })();
const TIER_TOTAL = TIER_CUM[TIER_CUM.length-1];
function tierFromHash(h){
  const x = h % TIER_TOTAL;
  for(let i=0;i<TIER_CUM.length;i++){ if(x<TIER_CUM[i]) return i; }
  return TIER_CUM.length-1;
}

const _familyMembers = {};
CLUB_NAMES.forEach(name=>{ const core=clubCore(name); (_familyMembers[core]=_familyMembers[core]||[]).push(name); });
const _familyHomeTier = {};
Object.keys(_familyMembers).forEach(core=>{ _familyHomeTier[core] = tierFromHash(hashStr(core)); });

// Datos reales confirmados a partir de las tablas de divisionales de la Liga (Mayores A-G da la escala

// CLUB_POOL: cada club con su nombre, su "familia" (institución madre) y su fuerza histórica fija (0=A..6=G).
const CLUB_POOL = CLUB_NAMES.map(name=>{
  const core = clubCore(name);
  const siblings = _familyMembers[core];
  const isParent = siblings[0]===name; // el listado primero de la familia es el equipo principal
  const baseTier = _familyHomeTier[core];
  // Los equipos filiales suelen jugar igual o un poco más flojo que el plantel principal.
  const estimatedTier = isParent ? baseTier : clamp(baseTier + (hashStr(name)%3), 0, 6);
  const tier = REAL_TIER_OVERRIDE[name]!==undefined ? REAL_TIER_OVERRIDE[name] : estimatedTier;
  return {name, family:core, isParent, tier, siblingCount:siblings.length};
});
// Letra de serie real para las formativas (Sub14/16/18), si el club aparece en los datos confirmados.
function realSerieLetter(catId, clubName){
  const g = REAL_SERIES_GROUP[catId] && REAL_SERIES_GROUP[catId][clubName];
  return (g!==undefined) ? DIV_LETTERS[g] : null;
}
const CLUB_BY_NAME = {}; CLUB_POOL.forEach(c=> CLUB_BY_NAME[c.name]=c);
function clubOf(name){ return CLUB_BY_NAME[name] || {name, family:name, isParent:true, tier:3, siblingCount:1}; }
function familyParentOf(name){
  const c = clubOf(name);
  return CLUB_POOL.find(x=>x.family===c.family && x.isParent) || c;
}
// Convierte la fuerza histórica (escala 0..6, "A..G") a la cantidad real de divisiones de la categoría.
function tierInCategory(tier, divisions){ return clamp(Math.round(tier*(divisions-1)/6), 0, divisions-1); }
function baseStrengthAdult(tier){ return 78 - tier*7; }

// la serie que terminaba siempre en Copa de Bronce. Se baja a 55 para que haya variedad real desde
// el arranque y una progresión creíble a medida que el jugador crece.
const BASE_STRENGTH_JUVENIL = 55;
function marketValue(ovr){
  const raw = Math.round(Math.pow(ovr,3)/900);
  if(raw>=1000) return '€'+(raw/1000).toFixed(1)+'M';

}

/* ---------- Atributos ---------- */
function initAttrs(pos){
  const attrs = {};
  ATTR_KEYS.forEach(k=> attrs[k] = clamp(42 + randi(-5,5), 25, 60));
  const w = POSITION_WEIGHTS[pos];
  const top2 = Object.entries(w).sort((a,b)=>b[1]-a[1]).slice(0,2).map(e=>e[0]);
  top2.forEach(k=> attrs[k]=clamp(attrs[k]+10,25,70));
  return attrs;
}
function computeOVR(attrs,pos){
  const w = POSITION_WEIGHTS[pos];
  let sum=0, wsum=0;
  Object.keys(w).forEach(k=>{ sum+=attrs[k]*w[k]; wsum+=w[k]; });
  return Math.round(sum/wsum);
}
function growAttributes(p, extra){
  extra = extra || {};
  const age = p.edad;
  const physKeys=['velocidad','fisico','resistencia','cabezazo'];
  const techKeys=['definicion','pase'];
  const mentKeys=['vision','liderazgo'];
  let physDelta, techDelta, mentDelta;
  if(age<=19){ physDelta=rand(2,5); techDelta=rand(2,5); mentDelta=rand(0,2); }
  else if(age<=25){ physDelta=rand(1,4); techDelta=rand(1,3); mentDelta=rand(0,2); }
  else if(age<=29){ physDelta=rand(-1,2); techDelta=rand(0,2); mentDelta=rand(1,3); }
  else if(age<=34){ physDelta=rand(-3,0); techDelta=rand(-1,1); mentDelta=rand(1,3); }
  else if(age<=44){ physDelta=rand(-4,-1); techDelta=rand(-2,0); mentDelta=rand(0,2); }
  else { physDelta=rand(-5,-2); techDelta=rand(-3,-1); mentDelta=rand(-1,1); }
  // Empujoncito de crecimiento ocasional: solo en carreras con "racha" (ver LUCKY_CAREER_CHANCE),
  // y ni siquiera todas las temporadas de esas carreras — nada de esto aplica al resto.
  if(p.luckyCareer && Math.random()<LUCKY_GROWTH_CHANCE){
    physDelta += 2; techDelta += 2; mentDelta += 1;
  }
  physKeys.forEach(k=> p.attrs[k]=clamp(p.attrs[k]+physDelta+rand(-1,1)+(extra[k]||0),20,99));
  techKeys.forEach(k=> p.attrs[k]=clamp(p.attrs[k]+techDelta+rand(-1,1)+(extra[k]||0),20,99));
  mentKeys.forEach(k=> p.attrs[k]=clamp(p.attrs[k]+mentDelta+rand(-1,1)+(extra[k]||0),20,99));
  p.ovr = computeOVR(p.attrs, p.posicion);
  p.peakOvr = Math.max(p.peakOvr, p.ovr);
}

/* ================= SIMULACIÓN ================= */
// Pequeño empujón de "protagonista": sube apenas la probabilidad de salir campeón (liga, copas
// y honor). Es un ajuste chico a propósito: no debe hacer que siempre ganes, solo mejorar un poco
// tus chances frente a un rival de nivel parejo. Para hacerlo más notorio, subir estos números;
// para volver a como estaba antes, ponerlos en 0.
const CHAMPION_LUCK_RATING = 0.5;   // puntos extra de rating en las tablas de posiciones (SIEMPRE, toda carrera)
const CHAMPION_LUCK_CHANCE = 0.015; // extra de probabilidad (0 a 1) en llaves de Copa/Honor (SIEMPRE, toda carrera)
// "Racha" de carrera: además del empujón parejo de arriba (que reciben TODAS las carreras),
// una porción de las carreras (sorteada una sola vez, al crear el jugador) recibe un empujón
// EXTRA bastante más notorio. El resto sigue exactamente con la dificultad de siempre. Así,
// a veces una carrera se siente "redonda" (más chances de ser campeón/ascender/llegar alto de
// nivel), pero no es la norma — sigue constando en la gran mayoría de las carreras.
const LUCKY_CAREER_CHANCE = 0.22;        // ~1 de cada 4-5 carreras tiene la racha
const LUCKY_RATING_BONUS = 1.2;          // puntos extra de rating, SOLO en carreras con racha
const LUCKY_CHANCE_BONUS = 0.02;         // probabilidad extra en Copa/Honor, SOLO en carreras con racha
const LUCKY_GROWTH_CHANCE = 0.12;        // % de temporadas con un empujoncito de crecimiento extra, SOLO en carreras con racha
function luckRatingFor(p){ return CHAMPION_LUCK_RATING + ((p && p.luckyCareer) ? LUCKY_RATING_BONUS : 0); }
function luckChanceFor(p){ return CHAMPION_LUCK_CHANCE + ((p && p.luckyCareer) ? LUCKY_CHANCE_BONUS : 0); }
function simulateStandingsJuvenil(ovr, n, p){
  const arr=[];
  for(let i=0;i<n-1;i++) arr.push({p:false, r: BASE_STRENGTH_JUVENIL + rand(-16,16)});
  arr.push({p:true, r: ovr + luckRatingFor(p) + rand(-8,8)});
  arr.sort((a,b)=>b.r-a.r);
  return arr.findIndex(t=>t.p)+1;
}
function simulateStandingsAdulta(tier, ovr, p){
  const n=16;
  const base = baseStrengthAdult(tier);
  const arr=[];
  for(let i=0;i<n-1;i++) arr.push({p:false, r: base + rand(-14,14)});
  arr.push({p:true, r: ovr*0.9 + luckRatingFor(p) + rand(-8,8)});
  arr.sort((a,b)=>b.r-a.r);
  return arr.findIndex(t=>t.p)+1;
}
function simulateBracket(rounds, winChance){
  let advanced=0;
  for(let r=0;r<rounds;r++){ if(Math.random()<winChance) advanced++; else break; }
  return {advanced, rounds, champ: advanced===rounds};
}
function simulateHonor(ovr, refStrength, p){
  const chance = clamp(0.42 + (ovr-refStrength)/120 + luckChanceFor(p), .1, .7);
  return simulateBracket(4, chance);
}
// Ascenso/descenso: siempre un solo escalón por temporada (nunca de la G a la A de una).
// Ascenso/descenso siempre de un solo escalón por temporada (nunca de la G a la A de una).
// En Divisionales de 16 equipos: suben los primeros 4, bajan los últimos 4.
function updateTierAdulta(cat, tier, posFinal){
  let newTier=tier, note=null, dir=null;
  if(posFinal<=4 && tier>0){ newTier=tier-1; note='Ascenso a Divisional '+DIV_LETTERS[newTier]; dir='up'; }
  else if(posFinal>=cat.teams-3 && tier<cat.divisions-1){ newTier=tier+1; note='Descenso a Divisional '+DIV_LETTERS[newTier]; dir='down'; }
  return {newTier, note, dir};
}
// La divisional inicial se ancla en la fuerza histórica del club (no solo en el nivel del jugador),
// con un ajuste de a lo sumo un escalón si el rendimiento es muy superior o muy inferior al del club.
function assignInitialAdultTier(cat, ovr, clubName){
  const home = tierInCategory(clubOf(clubName).tier, cat.divisions);
  const ref = baseStrengthAdult(home);
  let adj = 0;
  if(ovr >= ref+14) adj = -1;
  else if(ovr <= ref-14) adj = 1;
  return clamp(home+adj, 0, cat.divisions-1);
}

// A partir de los 24 años el estudio deja de aparecer y gana peso la vida laboral y personal
// (trabajo, casamiento, hijos, vínculo con el DT y el plantel). Los eventos son ocasionales:
// solo hay chance de que aparezca alguno un 40% de las temporadas.
function getEventPool(p){
  const pool = [pickInjuryEvent(), EVENT_CAPTAIN, EVENT_LOCKERROOM, EVENT_COACH_FIGHT, EVENT_NIGHT_OUT];
  if(p.edad<24) pool.push(EVENT_EXAMS);
  if(p.edad>=18 && p.edad<=23 && !p.milestones.wentExchange) pool.push(EVENT_EXCHANGE);
  if(p.edad>=23 && !p.milestones.graduated) pool.push(EVENT_GRADUATION);
  if(p.edad>=24 && !p.milestones.employed) pool.push(EVENT_JOB);
  if(p.edad>=17 && p.edad<=28 && !p.milestones.hadRelationship && !p.milestones.married) pool.push(EVENT_NOVIAZGO);
  if(p.edad>=26 && !p.milestones.married) pool.push(EVENT_MARRIAGE);
  if(p.edad>=28 && p.milestones.married && !p.milestones.child) pool.push(EVENT_CHILD);
  return pool;
}

function pickPressQuestionIdx(){
  if(PRESS_QUESTIONS.length<=1) return 0;
  let idx;
  do{ idx = Math.floor(Math.random()*PRESS_QUESTIONS.length); } while(idx===state.lastPressQuestionIdx);
  return idx;
}
function continueButtonAction(){
  const p = state.player;
  const cat = currentCategory();
  return (cat && cat.id==='mayores' && !p.pressInterviewDone) ? 'pressStart' : 'advance';
}
function startPressInterview(){
  // Solo una vez en toda la carrera, y únicamente durante Mayores (Primera). Si por algún
  // motivo se llama fuera de esas condiciones, se salta directo al flujo normal.
  const cat = currentCategory();
  if(state.player.pressInterviewDone || !cat || cat.id!=='mayores'){ advanceAfterResult(); return; }
  const idx = pickPressQuestionIdx();
  state.pendingInterview = {qIdx:idx};
  state.lastPressQuestionIdx = idx;
  state.screen = 'press';
  render();
}
function resolvePressAnswer(qIdx, aIdx){
  const p = state.player;
  const question = PRESS_QUESTIONS[qIdx];
  const answer = question.answers[aIdx];
  const eff = PRESS_TONE_EFFECTS[answer.tone];
  Object.keys(eff).forEach(k=>{ p.press[k] = clamp((p.press[k]||50) + eff[k], 0, 100); });
  const templates = PRESS_HEADLINES[answer.tone];
  state.lastPressHeadline = templates[Math.floor(Math.random()*templates.length)](p);
  state.lastPressTag = PRESS_TONE_TAGS[answer.tone];
  p.pressInterviewDone = true;
  state.screen = 'pressResult';
  render();
}

/* ================= ACCIONES ================= */
// El contador global se incrementa acá: es el único lugar donde se llama incrementCareerCounter(),
// justo cuando la persona hace click en "Comenzar carrera". Recargar la página NUNCA lo incrementa
// (loadCareerCount() solo lee el valor, no lo modifica).
function startCreate(){
  incrementCareerCounter();
  state.screen='create'; render();
}

function goToOffers(){
  const p = state.player;
  if(!p.apellido.trim()) p.apellido='JUGADOR';
  p.attrs = initAttrs(p.posicion);
  p.ovr = computeOVR(p.attrs, p.posicion);
  p.peakOvr = p.ovr;
  state.offers = shuffle(CLUB_POOL).slice(0,3).map(c=>c.name);
  state.screen='offers'; render();
}
function pickClub(name){
  const p = state.player;
  p.club = name; p.clubsPlayed.push(name);
  p.lastCategoryId='sub14'; p.serieLetter = realSerieLetter('sub14', p.club) || DIV_LETTERS[randi(0,3)];
  // Apenas arranca la carrera, mostramos los cupones de los sponsors (VCP + Punto Sano)
  // antes de la primera temporada (ver renderSponsorsCoupon / continueFromSponsorsCoupon).
  state.screen='sponsorsCoupon'; render();
}

function currentCategory(){
  const p = state.player;
  // Si estás repitiendo el año de Reserva tras un intercambio, la categoría de la próxima
  // temporada queda forzada a Reserva aunque tu edad ya corresponda a Mayores.
  if(p.categoryOverrideId){ return CATEGORIES.find(c=>c.id===p.categoryOverrideId) || categoryForAge(p.edad); }
  return categoryForAge(p.edad);
}

function playLostSeason(){
  const p = state.player;
  const cat = currentCategory();
  const histRow = {
    edad:p.edad, categoria:cat.label, club:p.club, tierLabel:'Intercambio académico', posFinal:null,
    pj:0, gls:0, ast:0, ovr:Math.round(p.ovr), cupLabel:null, cupChamp:false, honorQualified:false,
    honorChamp:false, tierNote:null, tierDir:null, mvp:false, topScorer:false, lostSeason:true,
  };
  p.history.push(histRow);
  // Si esta temporada perdida fue justo la del intercambio a los 22, programamos que la
  // PRÓXIMA temporada jugada sea un año repetido en Reserva, aunque tu edad ya sea de Mayores.
  if(p.repeatReservaPending){
    p.repeatReservaPending = false;
    p.categoryOverrideId = 'reserva';
    p._savedAdultTier = p.clubDivisionTier;
    const reservaCat = CATEGORIES.find(c=>c.id==='reserva');
    p.clubDivisionTier = assignInitialAdultTier(reservaCat, p.ovr, p.club);
  }
  state.lastResult = histRow;
  state.screen='result';
  render();
}
function playSeason(){
  const p = state.player;
  // El intercambio a los 22 hace perder la temporada entera: nada de simulación ni de sumar
  // al contador global de partidas (no se jugó ni un partido de verdad).
  if(p.skipNextSeason){ p.skipNextSeason = false; playLostSeason(); return; }
  // Cada click real en "Jugar temporada" suma 1 al contador global de partidas jugadas.
  incrementSeasonsCounter();
  const cat = currentCategory();
  // Si estás repitiendo el año de Reserva tras el intercambio a los 22, esta temporada se juega
  // con las reglas de Reserva aunque tu edad ya sea de Mayores; al terminar, se retoma tu
  // divisional de Mayores tal cual estaba (ver más abajo).
  const isRepeatedReserva = p.categoryOverrideId === 'reserva';
  let posFinal, tierLabel, cupResult=null, honorResult=null, tierUpdate={note:null,dir:null,newTier:p.clubDivisionTier};

  if(cat.type==='juvenil'){
    // Sub 14, Sub 16 y Sub 18 no tienen Campeonato de Honor (eso arranca recién en Sub 20).
    // Sus únicos torneos son estas cuatro copas, según la posición final en la serie.
    const serieN = serieTeamsFor(cat.id);
    posFinal = simulateStandingsJuvenil(p.ovr, serieN, p);
    tierLabel = 'Serie '+p.serieLetter;
    const quarter = Math.ceil(serieN/4);
    let label, diffAdj;
    if(posFinal<=quarter){label='Copa de Oro'; diffAdj=0;}
    else if(posFinal<=quarter*2){label='Copa de Plata'; diffAdj=-6;}
    else if(posFinal<=quarter*3){label='Copa de Bronce'; diffAdj=-12;}
    else {label='Copa de Confraternidad'; diffAdj=-18;}
    const chance = clamp(0.5 + (p.ovr-(BASE_STRENGTH_JUVENIL+diffAdj))/120 + luckChanceFor(p),.15,.85);
    const br = simulateBracket(3, chance);
    cupResult = {label, champ:br.champ};
  } else {
    const tier = clamp(p.clubDivisionTier,0,cat.divisions-1);
    posFinal = simulateStandingsAdulta(tier, p.ovr, p);
    tierLabel = cat.divisions<=1 ? 'Categoría única' : ('Divisional '+DIV_LETTERS[tier]);
    tierUpdate = updateTierAdulta(cat, tier, posFinal);
    if(posFinal<=4){ honorResult = simulateHonor(p.ovr, baseStrengthAdult(tier), p); }
  }

  // En las Divisionales de 16 equipos se juegan 22 fechas por temporada; en las Series juveniles,
  // todos contra todos entre los equipos de la serie.
  const pj = cat.type==='adulta' ? randi(20,22) : Math.max(6, Math.round((serieTeamsFor(cat.id)-1)*rand(.8,1)));
  const gf = GOAL_FACTOR[p.posicion]||.1, af = AST_FACTOR[p.posicion]||.1;
  const gls = Math.max(0, Math.round(pj*gf*(p.ovr/70)*rand(.6,1.3)));
  const ast = Math.max(0, Math.round(pj*af*(p.ovr/70)*rand(.6,1.3)));
  const amarillas = randi(0, Math.round(pj*0.28));
  const rojas = Math.random()<0.12 ? 1 : 0;
  const mvp = posFinal<=2 && p.ovr > (cat.type==='juvenil'?BASE_STRENGTH_JUVENIL:baseStrengthAdult(p.clubDivisionTier))+10 && Math.random()<0.3;
  // Balón de goleador: se lo lleva quien tuvo una temporada goleadora de verdad (0.5+ goles por
  // partido), pero no es automático — siempre hay otros candidatos peleándolo en la categoría.
  const golRate = pj>0 ? gls/pj : 0;
  const isTopScorer = golRate >= 0.5 && Math.random() < 0.25;

  const trophies=[]; const achievements=[];
  // "Campeón de Liga" y "Subcampeón" son títulos de las categorías adultas (con tabla de posiciones
  // real). En las juveniles no existe un campeón de liga aparte: tu posición en la Serie solo define
  // a qué Copa entrás (Oro/Plata/Bronce/Confraternidad); el único título real ahí es ganar esa Copa.
  if(cat.type==='adulta'){
    if(posFinal===1){ trophies.push('Campeón de Liga — '+cat.label+' ('+p.edad+' años)'); p.career.ligaTitles++; }
    if(posFinal===2){ achievements.push('Subcampeón — '+cat.label+' ('+p.edad+' años)'); p.career.subcampeonatos++; }
  }
  if(cupResult && cupResult.champ){
    trophies.push('Campeón '+cupResult.label+' — '+cat.label+' ('+p.edad+' años)');
    if(cupResult.label==='Copa de Oro') p.career.copaOro++;
    else if(cupResult.label==='Copa de Plata') p.career.copaPlata++;
    else if(cupResult.label==='Copa de Bronce') p.career.copaBronce++;
    else p.career.copaConfraternidad++;
  }
  if(honorResult && honorResult.champ){ trophies.push('Campeón de Honor — '+cat.label+' ('+p.edad+' años)'); p.career.honorTitles++; }
  if(tierUpdate.dir==='up') p.career.ascensos++;
  if(tierUpdate.dir==='down') p.career.descensos++;
  if(mvp){ achievements.push('MVP — '+cat.label+' ('+p.edad+' años)'); p.career.mvps++; }
  if(isTopScorer){ trophies.push('Balón de Goleador — '+cat.label+' ('+p.edad+' años)'); p.career.goleadores++; }
  p.career.amarillas += amarillas; p.career.rojas += rojas;

  const histRow = {
    edad:p.edad, categoria:cat.label, club:p.club, tierLabel, posFinal, pj, gls, ast,
    ovr:Math.round(p.ovr), cupLabel: cupResult?cupResult.label:null, cupChamp: cupResult?cupResult.champ:false,
    honorQualified: !!honorResult, honorChamp: honorResult?honorResult.champ:false,
    tierNote: tierUpdate.note, tierDir: tierUpdate.dir, mvp, topScorer: isTopScorer,
    repeatedReserva: isRepeatedReserva, isJuvenil: cat.type==='juvenil',
  };
  p.pj+=pj; p.gls+=gls; p.ast+=ast;
  p.history.push(histRow);
  trophies.forEach(t=>p.trophies.push(t));
  achievements.forEach(a=>p.achievements.push(a));
  if(cat.type==='adulta') p.clubDivisionTier = tierUpdate.newTier;
  // Se cierra el repechaje: volvés a tu divisional real de Mayores para la temporada siguiente.
  if(isRepeatedReserva){
    p.categoryOverrideId = null;
    p.clubDivisionTier = p._savedAdultTier;
    p._savedAdultTier = null;
  }

  state.lastResult = histRow;
  state.screen='result';
  render();
}

function advanceAfterResult(){
  if(Math.random()<0.4){
    const pool = getEventPool(state.player);
    state.pendingEvent = pool[Math.floor(Math.random()*pool.length)];

}
function resolveEvent(option){
  const p = state.player;
  p._attrDelta = {};
  p._eventNote = '';
  option.apply(p);
  state.lastEventNote = p._eventNote;
  finishAdvance(p._attrDelta);
}
// Umbral calibrado con una simulación de 3000 carreras hasta los 19 años: el OVR a esa edad
// va de ~57 a ~75, con promedio ~64.5 y percentil 90 en ~68. 68 deja la oferta profesional
// reservada más o menos al 10% de mejor nivel para esa edad, no a cualquiera.
const PRO_OFFER_OVR_THRESHOLD = 68;
function finishAdvance(extraAttrDelta){
  const p = state.player;
  growAttributes(p, extraAttrDelta||{});
  p.edad += 1;
  const nextCat = categoryForAge(p.edad);
  if(!nextCat){ state.screen='retired'; render(); return; }
  // Todos los saltos de categoría se dan por defecto según la edad (Sub14→Sub16→Sub18→Sub20→Reserva).
  // La única excepción es el pase de Reserva a Mayores: ese salto no es automático "de nombre" nomás,
  // se narra como el llamado del DT de Primera para que el jugador lo sienta como un logro.
  const isCallUpToMayores = nextCat.id==='mayores' && p.lastCategoryId==='reserva';
  // Salida de Sub 18 hacia Sub 20 (cumplís 19): si tu nivel está muy por encima del promedio para
  // esa edad, aparece la chance única de irte al fútbol profesional (termina la carrera acá).
  const isLeavingSub18 = nextCat.id==='sub20' && p.lastCategoryId==='sub18';
  // Caso muy poco probable: a veces la carrera pega un salto de nivel inesperado justo en el momento
  // de dejar Sub 18, como para que a algunos jugadores les llegue la chance de ser profesional aunque
  // su progreso normal no los hubiera dejado cerca del umbral. No pasa siempre, ni cerca.
  const RARE_PRO_BOOST_CHANCE = 0.08; // subido apenas (antes 0.05): sigue siendo raro, no pasa siempre
  if(isLeavingSub18 && p.ovr < PRO_OFFER_OVR_THRESHOLD && Math.random() < RARE_PRO_BOOST_CHANCE){
    p.ovr = clamp(PRO_OFFER_OVR_THRESHOLD + randi(0,4), 0, 99);
    p.peakOvr = Math.max(p.peakOvr||0, p.ovr);
    p._rareProBoost = true;
  }
  if(nextCat.id !== p.lastCategoryId){
    if(nextCat.type==='juvenil'){ p.serieLetter = realSerieLetter(nextCat.id, p.club) || DIV_LETTERS[randi(0,3)]; }
    else {
      // Al entrar a una nueva categoría adulta (Sub20, Reserva, Mayores, Pre Senior, Más 40)
      // la divisional de arranque siempre se recalcula desde la fuerza histórica del club, nunca se
      // arrastra el índice tal cual — así un club chico no "hereda" la A solo por haber llegado
      // arriba en una categoría con menos divisionales.
      p.clubDivisionTier = assignInitialAdultTier(nextCat, p.ovr, p.club);
    }
    p.lastCategoryId = nextCat.id;
  }
  p.transferSearchUsed = false;
  state.showDetails=false;
  if(isLeavingSub18 && p.ovr >= PRO_OFFER_OVR_THRESHOLD){
    state.screen = 'proOffer';
  } else {
    state.screen = isCallUpToMayores ? 'callup' : 'season';
  }
  render();
}
function continueFromCallup(){ state.screen='season'; render(); }

  const p = state.player;
  p.wentPro = true;
  state.screen='retired';
  state.lastLeaderboardRank=null;

/* ================= MODO DT (después de colgar los botines) =================
   Al terminar tu carrera como jugador (retiro normal o pase al profesionalismo), podés
   dirigir las juveniles del último club en el que jugaste. Reutiliza las MISMAS funciones de
   simulación de tabla ya probadas (simulateStandingsJuvenil / simulateStandingsAdulta) que usa
   el modo jugador, tratando tu "nivel de DT" como si fuera el OVR de un plantel. */
function coachRatingSeed(p){
  const liderazgo = (p.attrs && p.attrs.liderazgo) ? p.attrs.liderazgo : 50;
  return clamp(Math.round((p.peakOvr + liderazgo)/2), 35, 82);
}
function startCoaching(){
  const p = state.player;
  if(p.wentPro){ return; } // si te fuiste al profesionalismo, tu paso por la Liga terminó del todo
  const club = p.club || (p.clubsPlayed.length ? p.clubsPlayed[p.clubsPlayed.length-1] : 'un club');
  // Dos decisiones especiales, cada una en UN solo año de los 5 (no todos los años), sorteadas
  // sin repetirse entre sí: una sobre si traer un crack al plantel, otra sobre cómo manejar la
  // lesión grave de un juvenil clave.
  const pickedYears = shuffle([1,2,3,4,5]);
  const mayoresCat = CATEGORIES.find(cat=>cat.id==='mayores');
  const divisionTier = tierInCategory(clubOf(club).tier, mayoresCat.divisions);
  p.coach = {
    club,
    rating: coachRatingSeed(p),
    year: 0,          // años dirigidos en juveniles (0 a 5)
    phase: 'juveniles', // 'juveniles' | 'primera' | 'done'
    trophies: [],
    lastResultNote: null,
    nextSeasonChampionMod: 0, // empujón/castigo puntual de UNA temporada, por una decisión
    lastSigningNote: null,
    lastInjuryNote: null,
    signingYear: pickedYears[0],
    injuryDecisionYear: pickedYears[1],
    // Solo informativo (para mostrar contexto): en juveniles competís por Serie, en Primera
    // por Divisional. No afecta las probabilidades de ser campeón, que son las ya calibradas.
    serieLetter: realSerieLetter('sub18', club) || DIV_LETTERS[randi(0,3)],
    divisionTier,
    divisionLabel: 'Divisional '+DIV_LETTERS[divisionTier],
  };
  state.screen = 'coachHub';
  render();
}
// Antes de cada temporada en juveniles, se pregunta si querés traer una figura para reforzar el
// plantel. Es un albur real: puede potenciar al equipo o generar roces si el resto del plantel
// no lo toma bien. El efecto es chico y dura SOLO esa temporada (no acumula para siempre).

function coachPlainSeason(){

  } else {

function coachOfferInjuryDecision(){

}
function coachInjuryYes(){

    c.nextSeasonChampionMod = (c.nextSeasonChampionMod||0) + 0.05;

    c.lastInjuryNote = 'El reemplazo transitorio se acopló bien al plantel y el equipo no sintió la ausencia.';
  } else {

    c.rating = clamp(c.rating-1, 30, 90);
    c.lastInjuryNote = 'El reemplazo costó integrarse y el equipo sintió la ausencia del titular lesionado.';

// Probabilidades explícitas de ser campeón como DT (no dependen de la simulación de tablas del
// modo jugador): en juveniles, 40% cada año; en tu único año en la Primera, 20%. Cuando no salís
// campeón, igual se sortea al azar qué tan bien o mal te fue, para variar el relato.
const COACH_JUVENILES_CHAMPION_CHANCE = 0.25;
const COACH_PRIMERA_CHAMPION_CHANCE = 0.1;
function coachPlaySeason(){
  const p = state.player;
  const c = p.coach;
  if(c.phase==='juveniles'){
    c.year += 1;
    const effectiveChance = clamp(COACH_JUVENILES_CHAMPION_CHANCE + (c.nextSeasonChampionMod||0), 0.05, 0.6);
    const isChampion = Math.random() < effectiveChance;
    c.nextSeasonChampionMod = 0; // el empujón del fichaje dura una sola temporada
    let tier, delta, note;
    // Si no salís campeón, no te llevás ninguna copa: se sortea el relato de la temporada
    // (buena/pareja/floja) solo para variar el humor del año, sin adjudicarte ningún título.
    if(isChampion){
      tier='campeon'; delta=3;
      note='¡Temporada redonda! Fuiste campeón de la Copa de Oro con las juveniles de '+c.club+'.';
      c.trophies.push('Campeón de Copa de Oro — Juveniles, Año '+c.year);
    } else {
      const r = Math.random();
      if(r<0.35){ tier='buena'; delta=1; note='Buena campaña con las juveniles de '+c.club+', pero no alcanzó para ser campeón.'; }
      else if(r<0.65){ tier='irregular'; delta=0; note='Campaña pareja con las juveniles de '+c.club+': ni tan bien ni tan mal, sin título esta vez.'; }
      else if(r<0.85){ tier='floja'; delta=-1; note='Año flojo con las juveniles de '+c.club+', lejos de pelear el título.'; }
      else { tier='muyfloja'; delta=-1; note='Temporada floja, mucho para corregir de cara al año que viene.'; }
    }
    c.rating = clamp(c.rating+delta, 30, 90);
    c.lastResultNote = note;
    c.lastResultTier = tier;
  } else if(c.phase==='primera'){
    const isChampion = Math.random() < COACH_PRIMERA_CHAMPION_CHANCE;
    let tierRes, note;
    if(isChampion){
      tierRes='campeon';
      note='¡CAMPEÓN! Dirigiste a '+c.club+' a lo más alto en la '+c.divisionLabel+', tu único año en Primera.';
      c.trophies.push('Campeón de Liga como DT de Primera');
    } else {
      const r = Math.random();
      if(r<0.4){ tierRes='buena'; note='Gran año: terminaste peleando arriba de la tabla con la Primera de '+c.club+' en la '+c.divisionLabel+'.'; }
      else if(r<0.75){ tierRes='correcta'; note='Campaña correcta con la Primera de '+c.club+' en la '+c.divisionLabel+', sin sobresaltos.'; }
      else { tierRes='dificil'; note='Año difícil: peleaste el descenso hasta el final con la Primera de '+c.club+' en la '+c.divisionLabel+'.'; }
    }
    c.lastResultNote = note;
    c.lastResultTier = tierRes;
    c.phase = 'done';
  }
  state.screen = 'coachResult';
  render();
}
function coachAdvance(){
  const c = state.player.coach;
  if(c.phase==='done'){
    state.screen = 'coachFinal';
  } else if(c.phase==='juveniles' && c.year>=5){

// Mercado de pases realista:
// - Casi siempre ofertas de clubes de nivel similar o vecino (nunca saltos de más de 2-3 escalones).
// - Si jugás en la G, primero llegan ofertas de F/E/D; a C/B/A solo con muy buen rendimiento.
// - Si ya jugás en la A, no vas a recibir solo ofertas de categorías muy inferiores.
// - (Ya no hay clubes filiales con variantes de color en la nómina; esta rama queda inactiva.)
function weightedDelta(currentTier, maxTier, ovr, ref){
  const opts = [{d:0, w:3}];
  if(currentTier>0) opts.push({d:-1, w:4});
  if(currentTier<maxTier) opts.push({d:1, w:3});
  if(currentTier>=2 && ovr>=ref+16) opts.push({d:-2, w:1.2});
  if(currentTier>=3 && ovr>=ref+20) opts.push({d:-3, w:0.6});
  const total = opts.reduce((s,o)=>s+o.w,0);
  let r = Math.random()*total;
  for(const o of opts){ if(r<o.w) return o.d; r-=o.w; }
  return 0;
}
function findClubForTier(targetTier, cat, excludeNames){
  for(let radius=0; radius<=cat.divisions; radius++){
    const candidates = CLUB_POOL.filter(c=>{
      const t = tierInCategory(c.tier, cat.divisions);
      return Math.abs(t-targetTier)===radius && !excludeNames.includes(c.name);
    });
    if(candidates.length) return shuffle(candidates)[0];
  }
  return null;
}
function openTransferMarket(){
  const p = state.player;
  // Mercado de pases realista: una sola búsqueda por temporada. Una vez que se abre el
  // mercado (se generan ofertas), queda bloqueado hasta la próxima temporada, sin importar
  // si el jugador acepta una oferta o decide quedarse en su club.
  if(p.transferSearchUsed) return;
  p.transferSearchUsed = true;
  const cat = currentCategory();
  const used = [p.club];
  const offers = [];
  const myClub = clubOf(p.club);

  // Llamado del club principal si jugás en una filial.
  if(!myClub.isParent && Math.random()<0.55){
    const parent = familyParentOf(p.club);
    if(parent.name!==p.club){
      const parentTier = cat.type==='adulta' ? tierInCategory(parent.tier, cat.divisions) : null;
      offers.push({name:parent.name, tier:parentTier, familyCall:true});
      used.push(parent.name);
    }
  }

  if(cat.type==='adulta'){
    const maxTier = cat.divisions-1;
    const ref = baseStrengthAdult(p.clubDivisionTier);
    let guard = 0;
    while(offers.length<2 && guard<20){
      guard++;
      const delta = weightedDelta(p.clubDivisionTier, maxTier, p.ovr, ref);
      const targetTier = clamp(p.clubDivisionTier+delta, 0, maxTier);
      const club = findClubForTier(targetTier, cat, used);
      if(!club) break;
      offers.push({name:club.name, tier:targetTier, familyCall:false});
      used.push(club.name);
    }
  } else {
    const rest = shuffle(CLUB_POOL.filter(c=>!used.includes(c.name)));
    while(offers.length<2 && rest.length){ offers.push({name:rest.pop().name, tier:null, familyCall:false}); }
  }

  state.transferOffers = offers;
  state.screen='transfer'; render();
}
function pickTransfer(offer){
  const p = state.player;
  p.club = offer.name;
  if(!p.clubsPlayed.includes(offer.name)) p.clubsPlayed.push(offer.name);
  if(offer.tier!==null && offer.tier!==undefined) p.clubDivisionTier = offer.tier;
  state.screen='season'; render();
}
function cancelTransfer(){ state.screen='season'; render(); }

/* ================= COMPARTIR CARRERA (tarjeta imagen) ================= */
function shareWrapLines(ctx, text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  words.forEach(w=>{
    const test = cur ? cur+' '+w : w;
    if(ctx.measureText(test).width > maxWidth && cur){ lines.push(cur); cur = w; }
    else cur = test;
  });
  if(cur) lines.push(cur);
  return lines;
}
function shareDrawRounded(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function shareDrawTrophy(ctx,cx,cy,scale,pal){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.scale(scale,scale);
  ctx.fillStyle = pal.pedestal;
  shareDrawRounded(ctx,-24,58,48,14,2); ctx.fill();
  shareDrawRounded(ctx,-18,44,36,14,2); ctx.fill();
  ctx.fillStyle = pal.plaque; ctx.globalAlpha=.85;
  shareDrawRounded(ctx,-11,38,22,7,1); ctx.fill(); ctx.globalAlpha=1;
  ctx.fillStyle = pal.shade;
  ctx.beginPath(); ctx.ellipse(0,30,17,8,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = pal.main;
  ctx.beginPath();
  ctx.moveTo(-15,29); ctx.bezierCurveTo(-15,43,15,43,15,29); ctx.lineTo(10,18);
  ctx.bezierCurveTo(6,25,-6,25,-10,18); ctx.closePath(); ctx.fill();
  ctx.fillRect(-5,6,10,16);
  ctx.beginPath();
  ctx.moveTo(0,-44);
  ctx.bezierCurveTo(-14,-32,16,-20,-2,-6);
  ctx.bezierCurveTo(-16,4,12,14,0,30);
  ctx.bezierCurveTo(14,16,-12,6,2,-6);
  ctx.bezierCurveTo(18,-20,-12,-30,0,-44);
  ctx.closePath();
  ctx.strokeStyle = pal.shade; ctx.lineWidth=2; ctx.fill(); ctx.stroke();
  ctx.restore();
}
function shareDrawBall(ctx,cx,cy,r){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle='#F4F6FA'; ctx.fill();
  ctx.lineWidth=Math.max(2,r*0.07); ctx.strokeStyle='#152449'; ctx.stroke();
  ctx.fillStyle='#152449';
  ctx.beginPath();
  const pts=[[0,-r*0.5],[r*0.42,-r*0.15],[r*0.26,r*0.32],[-r*0.26,r*0.32],[-r*0.42,-r*0.15]];
  ctx.moveTo(cx+pts[0][0],cy+pts[0][1]);
  pts.slice(1).forEach(p=>ctx.lineTo(cx+p[0],cy+p[1]));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function shareDrawStar(ctx,cx,cy,r,color){
  ctx.save();
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const ang = -Math.PI/2 + i*Math.PI/5;
    const rad = i%2===0? r : r*0.42;
    const x = cx+Math.cos(ang)*rad, y = cy+Math.sin(ang)*rad;
    i===0? ctx.moveTo(x,y) : ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}
/* Paleta de la propia Liga Universitaria (misma que usa la interfaz): fondo claro,
   tarjeta blanca, franja navy con borde dorado, textos navy/gris. Nada de colores
   inventados: son las variables --bg/--surface/--navy/--gold/--text/--muted del juego. */
const SHARE_THEME = {
  pageBg:'#EEF2F8', surface:'#FFFFFF', surface2:'#F3F6FB', border:'#D7E0EE',
  navy:'#0F2050', navy2:'#14306E', gold:'#F2B632', goldSoft:'#FBEBC7',
  text:'#152449', muted:'#5E6E8C', goldText:'#8A5D06',
};
function buildCareerCardCanvas(){
  const p = state.player, c = p.career;
  const t = SHARE_THEME;
  const country = COUNTRIES.find(x=>x.code===p.pais) || COUNTRIES[0];
  const W = 800;
  const cardX=32, cardW=W-64, padX=cardX+46, innerW=cardW-92;

  // --- Medición previa: cuántas líneas ocupa la lista de clubes, para dimensionar el alto real ---
  const measureCanvas = document.createElement('canvas');
  measureCanvas.width = 10; measureCanvas.height = 10;
  const mctx = measureCanvas.getContext('2d');
  mctx.font = '600 15px Arial';
  const maxClubsShown = 24;
  const clubsShown = p.clubsPlayed.slice(0,maxClubsShown);
  let clubsText = clubsShown.join('   ·   ');
  if(p.clubsPlayed.length>maxClubsShown) clubsText += '   ·   y '+(p.clubsPlayed.length-maxClubsShown)+' más';
  const clubLines = shareWrapLines(mctx, clubsText, innerW-40);
  const clubLineH = 24;
  const clubBoxH = 26 + clubLines.length*clubLineH + 16;

  const trophyDefs = [
    {n:c.ligaTitles, pal:TROPHY_PALETTE.liga, label:'Liga', kind:'trophy'},
    {n:c.honorTitles, pal:TROPHY_PALETTE.honor, label:'Honor', kind:'trophy'},
    {n:c.copaOro, pal:TROPHY_PALETTE.oro, label:'C. Oro', kind:'trophy'},
    {n:c.copaPlata, pal:TROPHY_PALETTE.plata, label:'C. Plata', kind:'trophy'},
    {n:c.copaBronce, pal:TROPHY_PALETTE.bronce, label:'C. Bronce', kind:'trophy'},
    {n:c.copaConfraternidad, pal:TROPHY_PALETTE.confrat, label:'Confrat.', kind:'trophy'},
    {n:c.goleadores, pal:null, label:'Goleador', kind:'ball'},
    {n:c.mvps, pal:null, label:'MVP', kind:'star'},
  ].filter(d=>d.n>0);
  const trophySectionH = trophyDefs.length===0 ? 50 : (46 + Math.ceil(trophyDefs.length/4)*118 - 30);

  const headerH = 78;
  const topBlockH = 92 + 62 + 100 + 80; // nombre+flag, pills, stats, separador
  const clubsLabelH = 30;
  const trophyLabelH = 34;
  const footerH = 74;
  const H = 32 + headerH + 46 + topBlockH + clubsLabelH + clubBoxH + 30 + trophyLabelH + trophySectionH + footerH + 40;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = Math.round(H);
  const ctx = canvas.getContext('2d');
  const cardY=32, cardH=H-64;

  ctx.fillStyle = t.pageBg; ctx.fillRect(0,0,W,H);

  ctx.fillStyle = t.surface;
  shareDrawRounded(ctx,cardX,cardY,cardW,cardH,22); ctx.fill();
  ctx.strokeStyle = t.border; ctx.lineWidth=1.5;
  shareDrawRounded(ctx,cardX,cardY,cardW,cardH,22); ctx.stroke();

  // Franja superior navy con borde dorado, igual que el topbar del juego
  ctx.save();
  shareDrawRounded(ctx,cardX,cardY,cardW,headerH,22); ctx.clip();
  ctx.fillStyle = t.navy; ctx.fillRect(cardX,cardY,cardW,headerH);
  ctx.restore();
  ctx.fillStyle = t.gold; ctx.fillRect(cardX,cardY+headerH-4,cardW,4);
  ctx.textAlign='left';
  ctx.font='800 24px "Barlow Condensed","Arial"'; ctx.fillStyle=t.gold;
  ctx.fillText('LIGUERO', padX, cardY+34);
  ctx.font='600 13px Arial'; ctx.fillStyle='#D7E0EE';
  ctx.fillText('Liga Universitaria — Carrera de jugador', padX, cardY+56);

  let y = cardY+headerH+58;

  ctx.fillStyle = t.gold;
  shareDrawRounded(ctx,padX,y-46,86,64,14); ctx.fill();
  ctx.fillStyle='#241B04'; ctx.font='800 34px "Barlow Condensed","Arial"'; ctx.textAlign='center';
  ctx.fillText(String(Math.round(p.peakOvr)), padX+43, y+2);
  ctx.font='600 11px Arial'; ctx.fillText('OVR MAX', padX+43, y+22);

  ctx.textAlign='right'; ctx.font='40px Arial';
  ctx.fillText(country.flag, cardX+cardW-46, y-6);
  ctx.font='600 13px Arial'; ctx.fillStyle=t.muted;
  ctx.fillText(country.name, cardX+cardW-46, y+22);

  y += 92;
  ctx.textAlign='left';
  ctx.fillStyle=t.text; ctx.font='800 40px "Barlow Condensed","Arial"';
  ctx.fillText((p.apellido||'JUGADOR').toUpperCase(), padX, y);
  ctx.font='600 15px Arial'; ctx.fillStyle=t.muted;
  const lastClub = p.clubsPlayed.length? p.clubsPlayed[p.clubsPlayed.length-1] : '—';
  ctx.fillText('Último club: '+lastClub, padX, y+26);

  y += 62;
  const pillW = (innerW-2*16)/3;
  const pills = [
    {cap:'VALOR', val: marketValue(p.peakOvr)},
    {cap:'DORSAL', val:'#'+(p.numero||10)},
    {cap:'POSICIÓN', val:p.posicion},
  ];
  pills.forEach((pl,i)=>{
    const x = padX + i*(pillW+16);
    ctx.fillStyle=t.surface2;
    shareDrawRounded(ctx,x,y,pillW,64,12); ctx.fill();
    ctx.strokeStyle=t.border; ctx.lineWidth=1.5;
    shareDrawRounded(ctx,x,y,pillW,64,12); ctx.stroke();
    ctx.textAlign='center';
    ctx.font='600 11px Arial'; ctx.fillStyle=t.muted;
    ctx.fillText(pl.cap, x+pillW/2, y+22);
    ctx.font='800 22px "Barlow Condensed","Arial"'; ctx.fillStyle=t.goldText;
    ctx.fillText(pl.val, x+pillW/2, y+48);
  });

  y += 100;
  const statW = innerW/3;
  const avgGpg = p.pj>0 ? (p.gls/p.pj).toFixed(2) : '0.00';
  const stats = [ {v:p.pj,l:'PJ'}, {v:p.gls,l:'GOLES'}, {v:p.ast,l:'ASIST.'} ];
  stats.forEach((s,i)=>{
    const cx = padX + statW*i + statW/2;
    ctx.textAlign='center';
    ctx.font='800 34px "Barlow Condensed","Arial"'; ctx.fillStyle=t.text;
    ctx.fillText(String(s.v), cx, y);
    ctx.font='600 12px Arial'; ctx.fillStyle=t.muted;
    ctx.fillText(s.l, cx, y+20);
    if(i<2){ ctx.strokeStyle=t.border; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(padX+statW*(i+1),y-30); ctx.lineTo(padX+statW*(i+1),y+30); ctx.stroke(); }
  });
  ctx.font='600 12px Arial'; ctx.fillStyle=t.muted; ctx.textAlign='center';
  ctx.fillText('Prom. '+avgGpg+' goles/partido · '+p.history.length+' temporadas', cardX+cardW/2, y+42);

  y += 80;
  ctx.textAlign='left';
  ctx.font='700 13px "Space Grotesk","Arial"'; ctx.fillStyle=t.goldText;
  ctx.fillText('CLUBES EN LOS QUE JUGASTE', padX, y);
  y += 26;
  ctx.fillStyle=t.surface2;
  shareDrawRounded(ctx,padX,y,innerW,clubBoxH,12); ctx.fill();
  ctx.strokeStyle=t.border; ctx.lineWidth=1.5;
  shareDrawRounded(ctx,padX,y,innerW,clubBoxH,12); ctx.stroke();
  ctx.font='600 15px Arial'; ctx.fillStyle=t.text; ctx.textAlign='left';
  clubLines.forEach((line,i)=>{
    ctx.fillText(line, padX+20, y+30+i*clubLineH);
  });
  y += clubBoxH + 30;

  ctx.font='700 13px "Space Grotesk","Arial"'; ctx.fillStyle=t.goldText; ctx.textAlign='left';
  ctx.fillText('TÍTULOS Y LOGROS', padX, y);
  y += 34;
  if(trophyDefs.length===0){
    ctx.font='500 15px Arial'; ctx.fillStyle=t.muted;
    ctx.fillText('Todavía sin títulos... la carrera sigue.', padX, y+20);
  } else {
    const perRow = 4;
    const cellW = innerW/perRow;
    trophyDefs.forEach((d,i)=>{
      const row = Math.floor(i/perRow), col = i%perRow;
      const cx = padX + cellW*col + cellW/2;
      const cy = y + 46 + row*118;
      if(d.kind==='trophy') shareDrawTrophy(ctx,cx,cy,0.62,d.pal);
      else if(d.kind==='ball') shareDrawBall(ctx,cx,cy,26);
      else shareDrawStar(ctx,cx,cy,26,t.gold);
      ctx.fillStyle=t.goldText; ctx.font='800 15px Arial'; ctx.textAlign='center';
      ctx.fillText('x'+d.n, cx, cy+44);
      ctx.font='600 12px Arial'; ctx.fillStyle=t.muted;
      ctx.fillText(d.label, cx, cy+62);
    });
  }

  const footerY = cardY+cardH-52;
  ctx.strokeStyle=t.border; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(padX,footerY-22); ctx.lineTo(cardX+cardW-46,footerY-22); ctx.stroke();
  ctx.textAlign='left'; ctx.font='800 15px "Barlow Condensed","Arial"'; ctx.fillStyle=t.goldText;
  ctx.fillText('LIGUERO — Universidad', padX, footerY+4);
  ctx.font='500 12px Arial'; ctx.fillStyle=t.muted;
  ctx.fillText(String(location.href).replace(/^https?:\/\//,''), padX, footerY+22);

  // Sponsors en la tarjeta compartida: los logos se dibujan SOLO si ya están precargados (ver
  // getVcpLogoImg / getPsLogoImg / INIT), para no romper el gesto sincrónico de compartir en celular.
  const vcpImg = getVcpLogoImg();
  const psImg = getPsLogoImg();
  ctx.textAlign='right';
  ctx.font='600 11px Arial'; ctx.fillStyle=t.muted;
  ctx.fillText('Sponsors: VCP 👕 · Punto Sano 🥗', cardX+cardW-46, footerY+4);
  let logoCursorX = cardX+cardW-46;
  if(vcpImg && vcpImg.complete && vcpImg.naturalWidth>0){
    const logoH = 26, logoW = Math.round(logoH * (vcpImg.naturalWidth/vcpImg.naturalHeight));
    logoCursorX -= logoW;
    ctx.save();
    shareDrawRounded(ctx, logoCursorX, footerY+3, logoW, logoH, 5);
    ctx.clip();
    ctx.drawImage(vcpImg, logoCursorX, footerY+3, logoW, logoH);
    ctx.restore();
    logoCursorX -= 10;
  }
  if(psImg && psImg.complete && psImg.naturalWidth>0){
    const logoH = 26, logoW = Math.round(logoH * (psImg.naturalWidth/psImg.naturalHeight));
    logoCursorX -= logoW;
    ctx.save();
    shareDrawRounded(ctx, logoCursorX, footerY+3, logoW, logoH, 5);
    ctx.clip();
    ctx.drawImage(psImg, logoCursorX, footerY+3, logoW, logoH);
    ctx.restore();
  }

  return canvas;
}
function shareDataURLtoBlob(dataURL){
  const parts = dataURL.split(',');
  const contentType = parts[0].match(/:(.*?);/)[1];
  const raw = atob(parts[1]);
  const arr = new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
  return new Blob([arr], {type:contentType});
}
function shareDownloadFallback(dataURL, shareText, silent){
  const a = document.createElement('a');
  a.href = dataURL; a.download = 'mi-carrera-liguero.png';
  document.body.appendChild(a); a.click(); a.remove();
  try{ if(navigator.clipboard) navigator.clipboard.writeText(shareText); }catch(e){}
  if(!silent) alert('Se descargó la imagen de tu carrera 📸 (y copiamos el texto para compartir). ¡Subila donde quieras!');
}
// IMPORTANTE: todo esto corre en el mismo tick sincrónico del click del usuario (nada de
// await/canvas.toBlob antes de navigator.share): en el celular (Safari/Chrome iOS y Android)
// si se pierde ese "gesto de usuario" por un salto asincrónico, compartir falla en silencio.
function shareCareerCard(){
  const btn = document.getElementById('shareCareerBtn');
  try{
    const canvas = buildCareerCardCanvas();
    const dataURL = canvas.toDataURL('image/png');
    const shareText = 'Esta fue mi carrera en la Liga ⚽🎓 Intentá con la tuya:\n'+location.href+'\n\n👕 Con el aguante de VCP: '+VCP_URL+'\n🥗 Y las pilas de PUNTO SANO: '+PS_URL;
    let handled = false;
    if(navigator.share){
      const blob = shareDataURLtoBlob(dataURL);
      const file = new File([blob], 'mi-carrera-liguero.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:'Mi carrera en LIGUERO', text:shareText})
          .catch((e)=>{ if(!e || e.name!=='AbortError') shareDownloadFallback(dataURL, shareText); });
        handled = true;
      } else {
        // El navegador comparte texto/link nativo pero no adjunta imágenes: mandamos el
        // link igual y dejamos la imagen descargada aparte para que la suban a mano.
        navigator.share({title:'Mi carrera en LIGUERO', text:shareText}).catch(()=>{});
        shareDownloadFallback(dataURL, shareText, true);
        handled = true;
      }
    }
    if(!handled) shareDownloadFallback(dataURL, shareText);
  }catch(e){
    alert('No se pudo generar la imagen. Probá de nuevo.');
  }
}

const IG_AVATAR_PALETTE = ['#4C8CF2','#3FB57C','#E2604F','#9B6DE0','#33B0C4','#E08A3B','#C94F8C','#2E9E5B','#F2B632','#5E6E8C'];

  '🎉 Subió de categoría, más que merecido.','Ese ascenso se lo ganó con guantes blancos.',
  'Directo para arriba, vamos que se puede más 💪',
];

  'Merece ir a la A ya.','Con este nivel no puede seguir en esta categoría.',
  'Que lo asciendan de una vez, se lo ganó.',
];
const IG_HYPE_WELCOME = [
  'Bienvenido/a al club 🙌','A romperla este año 🔥','Suerte esta temporada, capo 👏',
];
function igShuffleN(arr, n){
  const copy = arr.slice();
  for(let i=copy.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [copy[i],copy[j]]=[copy[j],copy[i]]; }
  return copy.slice(0, Math.min(n, copy.length));
}
function igAvatarColor(p){ return IG_AVATAR_PALETTE[hashStr(p.apellido+'|'+p.club)%IG_AVATAR_PALETTE.length]; }
function igHandle(p){
  const base = (p.apellido||'jugador').toLowerCase().replace(/[^a-zñ0-9]/g,'');
  return '@'+(base||'jugador')+(p.numero||'');
}
function igFollowers(p){
  const c = p.career;
  const totalCampeonatos = c.ligaTitles+c.honorTitles+c.copaOro+c.copaPlata+c.copaBronce+c.copaConfraternidad;
  const base = 300 + p.peakOvr*45 + totalCampeonatos*2500 + c.goleadores*700 + c.mvps*500 + p.gls*10;
  const factor = 0.85 + (hashStr(p.apellido+'|'+p.club+'|f') % 30)/100;
  return Math.max(120, Math.round(base*factor));
}
function formatEs(n){ return Math.round(n).toLocaleString('de-DE'); }
function igBuildPost(p){
  const h = state.lastResult;
  const cat = currentCategory();
  const totalCampeonatos = p.career.ligaTitles+p.career.honorTitles+p.career.copaOro+p.career.copaPlata+p.career.copaBronce+p.career.copaConfraternidad;
  if(!h){
    return {
      caption: '⚽ Arrancando esta nueva carrera en '+p.club+'. ¡Vamos arriba!',
      comments: igShuffleN(IG_HYPE_WELCOME, Math.min(2, IG_HYPE_WELCOME.length)),
    };
  }
  const isChamp = !!(h.posFinal===1 || h.cupChamp || h.honorChamp);
  let caption;
  if(isChamp) caption = '🏆 ¡CAMPEÓN con '+p.club+'! Temporada soñada.';
  else if(h.tierDir==='up') caption = '🎉 ¡Ascendimos con '+p.club+'!';
  else caption = 'Otra temporada más defendiendo los colores de '+p.club+' 💪';

  let pool = isChamp ? IG_HYPE_CHAMPION.concat(IG_HYPE_GENERIC) : IG_HYPE_GENERIC.slice();
  let comments = igShuffleN(pool, isChamp ? 3 : 2);
  if(h.tierDir==='up'){
    comments = comments.concat(igShuffleN(IG_HYPE_PROMOTED, 1));
  } else if(cat && cat.type==='adulta' && cat.divisions>1 && p.clubDivisionTier>0 && Math.random()<0.5){
    comments = comments.concat(igShuffleN(IG_HYPE_ASPIRE_UP, 1));
  }
  if(isChamp || Math.random()<0.5){
    const rivalPool = CLUB_NAMES.filter(n=>n!==p.club);
    const rival = rivalPool[Math.floor(Math.random()*rivalPool.length)];
    const rivalTemplates = [
      'Dicen que lo quiere fichar '+rival+' 👀',
      rival+' ya está preguntando por él/ella.',
      'En '+rival+' sueñan con tenerlo.',
    ];
    comments.push(rivalTemplates[Math.floor(Math.random()*rivalTemplates.length)]);
  }
  // Los sponsors también aparecen de vez en cuando en los comentarios, sobre todo festejando
  // títulos. Cada uno tira su propia moneda al aire, así a veces sale uno, a veces el otro, y
  // a veces los dos — ninguno queda siempre relegado.
  if(isChamp && Math.random()<0.6){
    const vcpComments = [
      '👕 Con este título hay que estrenar algo de @vcp.uy.',
      '👕 Después de este título, a renovar el look con VCP.',
      'Con este nivel hay que vestirse acorde, VCP 🔥',
    ];
    comments.push(vcpComments[Math.floor(Math.random()*vcpComments.length)]);
  }
  if(isChamp && Math.random()<0.5){
    const psComments = [
      '🥗 A recargar pilas con @_puntosano.uy después de este título.',
      '🌱 Con este nivel hay que cuidarse: PUNTO SANO todo el año.',
      'Título + buenos hábitos = PUNTO SANO 🥑',
    ];
    comments.push(psComments[Math.floor(Math.random()*psComments.length)]);
  }
  return { caption, comments };
}
function renderInstagram(){
  const p = state.player;
  const cat = currentCategory();
  const totalCampeonatos = p.career.ligaTitles+p.career.honorTitles+p.career.copaOro+p.career.copaPlata+p.career.copaBronce+p.career.copaConfraternidad;
  const followers = igFollowers(p);

    : `<div class="ig-empty">Todavía no hay comentarios.</div>`;
  return `

    <div class="ig-topbar"><b>📷 Instagram</b></div>

    <div class="ig-bio">
      📍 ${p.club || '—'}<br>
      ⚽ ${POSITION_NAMES[p.posicion]||p.posicion}<br>

      <div class="ig-comments">${commentsHtml}</div>
    </div>
  </div>
  <button class="btn secondary" data-action="backFromInstagram">Volver</button>
  `;
