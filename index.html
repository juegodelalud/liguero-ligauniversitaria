/* ================= BIND ================= */
// En la pantalla de creación de personaje, cualquier click que dispare un render() (elegir
// posición, elegir pierna hábil) reconstruye el HTML desde cero. Si no guardamos antes lo que
// ya se tipeó en el input de apellido (y numero/país), se pierde: el input vuelve a mostrar el
// último valor GUARDADO en el estado, no lo que había en pantalla. Por eso sincronizamos los
// campos del formulario al estado ANTES de cualquier render() disparado desde esta pantalla.
function syncCreateFieldsIfPresent(){
  const elApellido = document.getElementById('apellido');
  if(!elApellido) return;
  state.player.apellido = elApellido.value;
  const elNumero = document.getElementById('numero');
  if(elNumero && elNumero.value!==''){ const n = parseInt(elNumero.value); if(!isNaN(n)) state.player.numero = n; }
  const elPais = document.getElementById('pais');
  if(elPais) state.player.pais = elPais.value;
}
function bindEvents(){
  const app = document.getElementById('app');
  app.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const action = el.getAttribute('data-action');
      if(action==='start') startCreate();
      else if(action==='pos'){ syncCreateFieldsIfPresent(); state.player.posicion = el.getAttribute('data-val'); render(); }
      else if(action==='pierna'){ syncCreateFieldsIfPresent(); state.player.pierna = el.getAttribute('data-val'); render(); }
      else if(action==='toOffers'){
        state.player.apellido = document.getElementById('apellido').value.toUpperCase();
        state.player.numero = parseInt(document.getElementById('numero').value)||10;
        state.player.pais = document.getElementById('pais').value;
        goToOffers();
      }
      else if(action==='pickClub'){ pickClub(el.getAttribute('data-name')); }
      else if(action==='playSeason') playSeason();
      else if(action==='transferMarket') openTransferMarket();
      else if(action==='pickTransfer'){ pickTransfer(state.transferOffers[parseInt(el.getAttribute('data-idx'))]); }
      else if(action==='cancelTransfer') cancelTransfer();
      else if(action==='retire') retireNow();
      else if(action==='advance') advanceAfterResult();
      else if(action==='event'){ resolveEvent(state.pendingEvent.options[parseInt(el.getAttribute('data-idx'))]); }
      else if(action==='restart') restart();
      else if(action==='toggleDetails') toggleDetails();
      else if(action==='continueCallup') continueFromCallup();
      else if(action==='shareCareer'){ shareCareerCard(); }
      else if(action==='viewInstagram'){ state.instagramReturnScreen = state.screen; state.screen='instagram'; render(); }
      else if(action==='backFromInstagram'){ state.screen = state.instagramReturnScreen || 'season'; render(); }
      else if(action==='pressStart'){ startPressInterview(); }
      else if(action==='pressAnswer'){ resolvePressAnswer(parseInt(el.getAttribute('data-qidx')), parseInt(el.getAttribute('data-aidx'))); }
      else if(action==='pressContinue'){ advanceAfterResult(); }
      else if(action==='viewLeaderboard'){ state.leaderboardReturnScreen = state.screen; state.screen='leaderboard'; render(); loadLeaderboardIntoDOM(); loadTitlesLeaderboardIntoDOM(); }
      else if(action==='backFromLeaderboard'){ state.screen = state.leaderboardReturnScreen || 'home'; render(); }
      else if(action==='viewVcpCoupon'){ viewVcpCoupon(); }
      else if(action==='backFromVcpCoupon'){ backFromVcpCoupon(); }
      else if(action==='continueFromVcpCoupon'){ continueFromVcpCoupon(); }
      else if(action==='viewSponsorsCoupon'){ viewSponsorsCoupon(); }
      else if(action==='backFromSponsorsCoupon'){ backFromSponsorsCoupon(); }
      else if(action==='continueFromSponsorsCoupon'){ continueFromSponsorsCoupon(); }
      else if(action==='goProfessional'){ goProfessional(); }
      else if(action==='stayInLeague'){ stayInLeague(); }
      else if(action==='startCoaching'){ startCoaching(); }
      else if(action==='coachPlaySeason'){ coachPlaySeason(); }
      else if(action==='coachAdvance'){ coachAdvance(); }
      else if(action==='acceptPrimeraCoach'){ acceptPrimeraCoach(); }
      else if(action==='declineCoachAfterJuveniles'){ declineCoachAfterJuveniles(); }
      else if(action==='coachOfferSigning'){ coachOfferSigning(); }
      else if(action==='coachSigningYes'){ coachSigningYes(); }
      else if(action==='coachSigningNo'){ coachSigningNo(); }
      else if(action==='coachPlainSeason'){ coachPlainSeason(); }
      else if(action==='coachOfferInjuryDecision'){ coachOfferInjuryDecision(); }
      else if(action==='coachInjuryYes'){ coachInjuryYes(); }
      else if(action==='coachInjuryNo'){ coachInjuryNo(); }
    });
  });
}

/* ================= CONTADORES GLOBALES (públicos, sin configurar nada) =================
   Dos contadores reales, compartidos entre TODOS los que jueguen desde cualquier navegador:
   uno de carreras iniciadas y otro de partidas (temporadas) jugadas. Usan un servicio de
   contadores públicos y gratuitos (countapi.mileshilliard.com, el reemplazo activo del viejo
   countapi.xyz que dejó de funcionar) — no hace falta crear ninguna cuenta ni configurar nada,
   funcionan apenas subís el archivo. Como esa API no usa "namespaces" (todas las claves son
   globales), las claves de acá abajo ya son bien únicas para no chocar con el contador de nadie
   más. Si por algún motivo el servicio no responde, cada contador cae de forma automática a un
   conteo local en el propio navegador (se avisa con "(en este navegador)") para que el número
   nunca quede roto en pantalla.
*/
const COUNTER_API_BASE = 'https://countapi.mileshilliard.com/api/v1';
const CAREERS_KEY = 'liguero_lud_santiago_geisinger_carreras_iniciadas';
const SEASONS_KEY = 'liguero_lud_santiago_geisinger_partidas_jugadas';

function parseCounterValue(data){
  if(!data) return null;
  const n = typeof data.value === 'number' ? data.value : parseInt(data.value, 10);
  return Number.isFinite(n) ? n : null;
}
async function fetchGlobalCount(key){
  try{
    const res = await fetch(`${COUNTER_API_BASE}/get/${key}`);
    if(res.status === 404) return 0; // todavía nadie hizo el primer hit de esta clave
    const data = await res.json();
    return parseCounterValue(data);
  }catch(e){ return null; }
}
async function hitGlobalCount(key){
  try{
    const res = await fetch(`${COUNTER_API_BASE}/hit/${key}`);
    const data = await res.json();
    return parseCounterValue(data);
  }catch(e){ return null; }
}

// Lee los dos contadores globales al cargar la página (nunca los incrementa, solo los muestra).
async function loadCareerCount(){
  const el = document.getElementById('careerCount');
  const elSeasons = document.getElementById('seasonsCount');
  const [careers, seasons] = await Promise.all([fetchGlobalCount(CAREERS_KEY), fetchGlobalCount(SEASONS_KEY)]);
  if(el) el.textContent = careers!==null ? careers : (parseInt(localStorage.getItem('lud_local_careers')||'0',10)+' (en este navegador)');
  if(elSeasons) elSeasons.textContent = seasons!==null ? seasons : (parseInt(localStorage.getItem('lud_local_seasons')||'0',10)+' (en este navegador)');
}

// Suma 1 al contador global de carreras. Se llama SOLO desde startCreate() (click en
// "Comenzar carrera"), nunca al recargar la página ni al elegir posición/club.
async function incrementCareerCounter(){
  const el = document.getElementById('careerCount');
  const n = await hitGlobalCount(CAREERS_KEY);
  if(n!==null){ if(el) el.textContent = n; return; }
  let local = parseInt(localStorage.getItem('lud_local_careers')||'0',10)+1;
  try{ localStorage.setItem('lud_local_careers', String(local)); }catch(_){}
  if(el) el.textContent = local+' (en este navegador)';
}

// Suma 1 al contador global de partidas (temporadas jugadas). Se llama SOLO desde playSeason()
// (click en "Jugar temporada"), así el número refleja partidas reales de todo el mundo.
async function incrementSeasonsCounter(){
  const el = document.getElementById('seasonsCount');
  const n = await hitGlobalCount(SEASONS_KEY);
  if(n!==null){ if(el) el.textContent = n; return; }
  let local = parseInt(localStorage.getItem('lud_local_seasons')||'0',10)+1;
  try{ localStorage.setItem('lud_local_seasons', String(local)); }catch(_){}
  if(el) el.textContent = local+' (en este navegador)';
}

/* ================= RANKING GLOBAL: TOP 3 HISTÓRICO DE LA LIGA =================
   Usa el MISMO servicio ya probado y funcionando de los contadores (countapi.mileshilliard.com,
   sin registro ni claves). Ese servicio solo guarda NÚMEROS por clave, no texto, así que el
   nombre del jugador se codifica de forma reversible como un número (base 36) y el club se
   guarda como su posición dentro de CLUB_NAMES. Se arma con 3 "puestos" (top1/top2/top3), cada
   uno con 3 claves numéricas propias (ovr, nombre codificado, índice de club).
   Aviso honesto: como no hay una operación atómica de "comparar y guardar" en este servicio
   gratuito, si dos personas se retiran en el mismo instante exacto podría perderse una
   actualización. Para el uso normal del juego eso no va a pasar. */
const LB_KEY_PREFIX = 'liguero_lud_santiago_geisinger_top';
const LB_ALPHABET = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
function lbEncodeName(name){
  const clean = (name||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10);
  if(!clean) return 0;
  let n = 0;
  for(let i=0;i<clean.length;i++){ n = n*36 + (LB_ALPHABET.indexOf(clean[i])+1); }
  return n;
}
function lbDecodeName(num){
  num = Math.round(Number(num)||0);
  if(!num) return '???';
  const chars = [];
  while(num>0){
    let d = num % 36;
    if(d===0) d = 36;
    chars.unshift(LB_ALPHABET[d-1]);
    num = (num-d)/36;
  }
  return chars.join('');
}
function lbClubIndex(name){ const i = CLUB_NAMES.indexOf(name); return i>=0 ? i : -1; }
function lbClubName(idx){ return (idx!==null && idx!==undefined && idx>=0 && CLUB_NAMES[idx]) ? CLUB_NAMES[idx] : '—'; }
function lbKey(slot, field){ return LB_KEY_PREFIX+slot+'_'+field; }
async function lbSetCount(key, value){
  try{ await fetch(`${COUNTER_API_BASE}/set/${key}?value=${encodeURIComponent(Math.round(value))}`); }catch(e){}
}
async function lbFetchSlot(slot){
  const [ovr, nameNum, clubNum] = await Promise.all([
    fetchGlobalCount(lbKey(slot,'ovr')),
    fetchGlobalCount(lbKey(slot,'name')),
    fetchGlobalCount(lbKey(slot,'club')),
  ]);
  return { ovr: ovr||0, nameNum: nameNum||0, clubIdx: (clubNum===null||clubNum===undefined) ? -1 : clubNum };
}
async function lbSetSlot(slot, entry){
  await Promise.all([
    lbSetCount(lbKey(slot,'ovr'), entry.ovr),
    lbSetCount(lbKey(slot,'name'), entry.nameNum),
    lbSetCount(lbKey(slot,'club'), entry.clubIdx),
  ]);
}
async function lbFetchTop3(){
  const slots = await Promise.all([1,2,3].map(s=>lbFetchSlot(s)));
  return slots.map(s => s.ovr>0 ? { ovr:s.ovr, name: lbDecodeName(s.nameNum), club: lbClubName(s.clubIdx) } : null);
}
// Se llama SOLO al retirarse (el peakOvr ya es definitivo). No bloquea la pantalla de retiro:
// se ejecuta en segundo plano y, si corresponde, actualiza el cartel de "entraste al Top 3".
async function lbMaybeSubmit(p){
  const newOvr = Math.round(p.peakOvr);
  if(newOvr<=0) return;
  try{
    const slots = await Promise.all([1,2,3].map(s=>lbFetchSlot(s)));
    let insertAt = -1;
    for(let i=0;i<3;i++){ if(newOvr > (slots[i].ovr||0)){ insertAt = i; break; } }
    if(insertAt===-1) return;
    const entries = slots.map(s=>({ovr:s.ovr, nameNum:s.nameNum, clubIdx:s.clubIdx}));
    entries.splice(insertAt, 0, { ovr:newOvr, nameNum: lbEncodeName(p.apellido), clubIdx: lbClubIndex(p.club) });
    entries.length = 3;
    await Promise.all(entries.map((e,i)=>lbSetSlot(i+1, e)));
    if(state.player===p && state.screen==='retired'){
      state.lastLeaderboardRank = insertAt+1;
      render();
    }
  }catch(e){ /* si falla la red, el resto del juego sigue funcionando igual */ }
}
async function loadLeaderboardIntoDOM(){
  const el = document.getElementById('lbList');
  if(!el) return;
  try{
    const top3 = await lbFetchTop3();
    const freshEl = document.getElementById('lbList');
    if(!freshEl) return; // el jugador ya se fue de la pantalla
    const medals = ['🥇','🥈','🥉'];
    freshEl.innerHTML = top3.map((e,i)=> e
      ? `<div class="trophy-item">${medals[i]} <span style="font-size:14px;"><strong>${e.name}</strong> — OVR ${e.ovr} · ${e.club}</span></div>`
      : `<div class="trophy-item">${medals[i]} <span class="muted" style="font-size:13px;">Todavía nadie llegó a este puesto.</span></div>`
    ).join('');
  }catch(e){
    const freshEl = document.getElementById('lbList');
    if(freshEl) freshEl.innerHTML = '<p class="muted" style="font-size:13px;">No se pudo cargar el ranking ahora. Probá de nuevo más tarde.</p>';
  }
}

// ===== Top 3 histórico de máximos ganadores de títulos (Liga + Copas + Honor, suma de toda la carrera) =====
const TB_KEY_PREFIX = 'liguero_lud_santiago_geisinger_titles_top';
function tbKey(slot, field){ return TB_KEY_PREFIX+slot+'_'+field; }
function totalTitlesFor(p){ return p.career.ligaTitles+p.career.honorTitles+p.career.copaOro+p.career.copaPlata+p.career.copaBronce+p.career.copaConfraternidad; }
async function tbFetchSlot(slot){
  const [titles, nameNum, clubNum] = await Promise.all([
    fetchGlobalCount(tbKey(slot,'titles')),
    fetchGlobalCount(tbKey(slot,'name')),
    fetchGlobalCount(tbKey(slot,'club')),
  ]);
  return { titles: titles||0, nameNum: nameNum||0, clubIdx: (clubNum===null||clubNum===undefined) ? -1 : clubNum };
}
async function tbSetSlot(slot, entry){

    lbSetCount(tbKey(slot,'titles'), entry.titles),
    lbSetCount(tbKey(slot,'name'), entry.nameNum),
    lbSetCount(tbKey(slot,'club'), entry.clubIdx),

}
async function tbFetchTop3(){

  return slots.map(s => s.titles>0 ? { titles:s.titles, name: lbDecodeName(s.nameNum), club: lbClubName(s.clubIdx) } : null);
}
// Igual que lbMaybeSubmit: se llama solo al terminar la carrera (retiro o pase a profesional),
// cuando la cantidad de títulos ya es definitiva. No bloquea la pantalla de retiro.
async function tbMaybeSubmit(p){
  const newTitles = Math.round(totalTitlesFor(p));
  if(newTitles<=0) return;
  try{
    const slots = await Promise.all([1,2,3].map(s=>tbFetchSlot(s)));

    for(let i=0;i<3;i++){ if(newTitles > (slots[i].titles||0)){ insertAt = i; break; } }
    if(insertAt===-1) return;
    const entries = slots.map(s=>({titles:s.titles, nameNum:s.nameNum, clubIdx:s.clubIdx}));
    entries.splice(insertAt, 0, { titles:newTitles, nameNum: lbEncodeName(p.apellido), clubIdx: lbClubIndex(p.club) });
    entries.length = 3;
    await Promise.all(entries.map((e,i)=>tbSetSlot(i+1, e)));
    if(state.player===p && state.screen==='retired'){
      state.lastTitlesLeaderboardRank = insertAt+1;
      render();
    }
  }catch(e){ /* si falla la red, el resto del juego sigue funcionando igual */ }
}

let feedbackRating = null;
function setupFeedbackUI(){
  const btn=document.getElementById('feedbackBtn');
  const modal=document.getElementById('feedbackModal');
  const rateUp=document.getElementById('rateUp');
  const rateDown=document.getElementById('rateDown');
  const send=document.getElementById('sendFeedback');
  const close1=document.getElementById('closeFeedback');
  const close2=document.getElementById('closeFeedback2');
  function openModal(){ modal.style.display='flex'; document.getElementById('feedbackForm').style.display='block'; document.getElementById('feedbackThanks').style.display='none'; }
  function closeModal(){ modal.style.display='none'; }
  // El botón de feedback es flotante y discreto: solo aparece si se lo toca, nunca interrumpe la partida.
  btn.addEventListener('click', openModal);
  close1.addEventListener('click', closeModal);
  close2.addEventListener('click', closeModal);
  modal.addEventListener('click', (e)=>{ if(e.target===modal) closeModal(); });
  rateUp.addEventListener('click', ()=>{ feedbackRating='up'; rateUp.classList.add('active'); rateDown.classList.remove('active'); });
  rateDown.addEventListener('click', ()=>{ feedbackRating='down'; rateDown.classList.add('active'); rateUp.classList.remove('active'); });
  send.addEventListener('click', async ()=>{
    const comment = document.getElementById('feedbackComment').value.trim();
    const payload = {rating:feedbackRating, comment, ts:Date.now()};
    let saved=false;
    if(window.storage){
      try{
        const key = 'feedback:'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
        await window.storage.set(key, JSON.stringify(payload), true);
        saved=true;
      }catch(e){ saved=false; }
    }
    if(!saved){
      // Publicado como página web sin backend propio: se guarda localmente en el navegador.
      // Para recibir estos comentarios de verdad, conviene reemplazar este bloque por un
      // endpoint gratuito tipo Formspree o un Google Form, o simplemente leer el localStorage
      // "lud_feedback_*" desde la consola del navegador de quien lo publique.
      try{ localStorage.setItem('lud_feedback_'+Date.now(), JSON.stringify(payload)); }catch(e){}
      saved = true;
    }
    document.getElementById('feedbackForm').style.display='none';
    document.getElementById('feedbackThanks').style.display='block';
  });
}

/* ================= INIT ================= */
state = newState();
render();
setupFeedbackUI();
